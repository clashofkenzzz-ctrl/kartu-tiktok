<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Manajemen Kartu TikTok (Unlimited)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      margin: 0;
      padding: 24px 16px;
    }
    .wrapper {
      max-width: 960px;
      margin: 0 auto;
    }
    .header-panel {
      background: #1e293b;
      padding: 20px 24px;
      border-radius: 14px;
      border: 1px solid #334155;
      margin-bottom: 20px;
    }
    .top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .header-title h2 { margin: 0 0 6px; font-size: 20px; color: #fff; }
    .header-title p { margin: 0; font-size: 13px; color: #94a3b8; }
    
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .badge-stat {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    
    /* Panel Kontrol Rentang & Pencarian */
    .filter-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      align-items: center;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .filter-group input {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .filter-group input:focus { border-color: #fe2c55; }
    .btn-apply {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-apply:hover { background: #2563eb; }

    /* Daftar Kartu */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .card-item.active-card { border-left: 5px solid #10b981; }
    .card-item.inactive-card { border-left: 5px solid #64748b; }
    
    .col-id {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 160px;
    }
    .id-tag {
      background: #fe2c55;
      color: #fff;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .status-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .status-pill.aktif {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-pill.kosong {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .col-input {
      flex: 1;
      min-width: 260px;
    }
    .url-input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .url-input:focus { border-color: #fe2c55; }
    
    .col-btns {
      display: flex;
      gap: 8px;
    }
    .btn-update {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-update:hover { background: #059669; }
    .btn-reset {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-reset:hover { background: #dc2626; }
    .btn-link {
      background: #334155;
      color: #f1f5f9;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
    }
    .btn-link:hover { background: #475569; }
    .btn-disabled { opacity: 0.35; pointer-events: none; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-panel">
      <div class="top-row">
        <div class="header-title">
          <h2>Dashboard Kontrol Kartu TikTok (Unlimited System)</h2>
          <p>Kelola tautan kartu tanpa batasan jumlah ID.</p>
        </div>
        <div class="stats-row">
          <div class="badge-stat">Aktif di DB: <strong id="countAktif" style="color:#34d399;">0</strong></div>
          <button class="btn-apply" onclick="fetchDatabase()">Segarkan DB</button>
        </div>
      </div>

      <!-- Alat Pengatur Rentang Tampilan ID -->
      <div class="filter-panel">
        <div class="filter-group">
          <label>Tampilkan Urutan ID Sampai:</label>
          <input type="number" id="maxDisplayRange" value="12" min="1" style="width: 80px;">
        </div>
        <button class="btn-apply" onclick="renderDashboard()">Terapkan Urutan</button>

        <div class="filter-group" style="margin-left: auto;">
          <label>Buka/Cari ID Khusus:</label>
          <input type="text" id="customIdSearch" placeholder="misal: 100 atau VIP-01" style="width: 160px;">
          <button class="btn-apply" style="background:#fe2c55;" onclick="addSpecificId()">Tampilkan</button>
        </div>
      </div>
    </div>

    <!-- Container Daftar Kartu -->
    <div class="card-list" id="cardListContainer">
      <div style="text-align: center; color: #94a3b8; padding: 40px;">Mengambil data cloud...</div>
    </div>
  </div>

  <script>
    // ================= MASUKKAN KREDENSIAL JSONBIN =================
    const BIN_ID = "MASUKKAN_BIN_ID_ANDA_DISINI";
    const MASTER_KEY = "MASUKKAN_MASTER_KEY_ANDA_DISINI";
    // ===============================================================

    let database = {};
    const extraCustomIds = new Set();

    async function fetchDatabase() {
      const container = document.getElementById('cardListContainer');
      container.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 40px;">Memperbarui data dari cloud...</div>';

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": MASTER_KEY }
        });
        const data = await res.json();
        database = data.record || {};
        renderDashboard();
      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 40px;">Gagal memuat database. Periksa BIN_ID dan MASTER_KEY.</div>';
      }
    }

    function renderDashboard() {
      const container = document.getElementById('cardListContainer');
      container.innerHTML = "";

      // 1. Kumpulkan semua ID yang akan ditampilkan
      const idSet = new Set();

      // Masukkan rentang nomor urut (default 1 s/d input range)
      const maxRange = parseInt(document.getElementById('maxDisplayRange').value, 10) || 12;
      for (let i = 1; i <= maxRange; i++) {
        idSet.add(String(i).padStart(2, '0'));
      }

      // Otomatis masukkan SEMUA ID yang sudah aktif di database (unlimited)
      Object.keys(database).forEach(id => idSet.add(id));

      // Masukkan custom ID yang dicari manual
      extraCustomIds.forEach(id => idSet.add(id));

      // Urutkan ID (numerik terlebih dahulu, lalu string)
      const sortedIds = Array.from(idSet).sort((a, b) => {
        const numA = parseInt(a, 10);
        const numB = parseInt(b, 10);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return a.localeCompare(b);
      });

      let countAktif = 0;

      // Render setiap kartu
      sortedIds.forEach(idStr => {
        const activeUrl = database[idStr] || "";
        const isAktif = Boolean(activeUrl);
        if (isAktif) countAktif++;

        const item = document.createElement('div');
        item.className = `card-item ${isAktif ? 'active-card' : 'inactive-card'}`;

        item.innerHTML = `
          <div class="col-id">
            <span class="id-tag">ID: ${idStr}</span>
            <span class="status-pill ${isAktif ? 'aktif' : 'kosong'}">${isAktif ? '● Aktif' : '○ Kosong'}</span>
          </div>

          <div class="col-input">
            <input type="text" class="url-input" id="input_${idStr}" 
              placeholder="${isAktif ? '' : 'Belum diaktivasi (kosong)'}" 
              value="${activeUrl}">
          </div>

          <div class="col-btns">
            <button class="btn-update" onclick="saveLink('${idStr}')">Simpan</button>
            <button class="btn-reset ${isAktif ? '' : 'btn-disabled'}" onclick="resetKartu('${idStr}')">Reset</button>
            <a href="${activeUrl || '#'}" target="_blank" class="btn-link ${isAktif ? '' : 'btn-disabled'}">Buka</a>
          </div>
        `;

        container.appendChild(item);
      });

      document.getElementById('countAktif').innerText = countAktif;
    }

    // Tambah / Buka ID Tertentu Langsung
    function addSpecificId() {
      const val = document.getElementById('customIdSearch').value.trim();
      if (!val) return;
      extraCustomIds.add(val);
      renderDashboard();
      document.getElementById('customIdSearch').value = "";
      
      // Auto-scroll ke input ID tersebut
      setTimeout(() => {
        const targetInput = document.getElementById(`input_${val}`);
        if (targetInput) targetInput.focus();
      }, 100);
    }

    // Simpan / Edit Link
    async function saveLink(cardId) {
      let val = document.getElementById(`input_${cardId}`).value.trim();
      if (!val) {
        alert("Link TikTok tidak boleh kosong. Gunakan tombol Reset untuk mengosongkan.");
        return;
      }

      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        val = "https://" + val;
      }

      database[cardId] = val;
      await syncToCloud(`Kartu ${cardId} berhasil diupdate ke link baru!`);
    }

    // Reset Kartu (Menghapus link dari database)
    async function resetKartu(cardId) {
      const ask = confirm(`Reset Kartu ${cardId}?\nLink TikTok akan dihapus dan kartu akan kembali kosong.`);
      if (!ask) return;

      delete database[cardId];
      await syncToCloud(`Kartu ${cardId} berhasil di-reset menjadi kosong!`);
    }

    // Sinkronisasi ke JSONBin
    async function syncToCloud(pesanSukses) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": MASTER_KEY
          },
          body: JSON.stringify(database)
        });

        alert(pesanSukses);
        renderDashboard();
      } catch (err) {
        alert("Gagal sinkronisasi data ke cloud!");
      }
    }

    fetchDatabase();
  </script>
</body>
</html>
