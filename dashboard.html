<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Manajemen Kartu TikTok</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      margin: 0;
      padding: 24px 16px;
    }
    .wrapper {
      max-width: 960px;
      margin: 0 auto;
    }
    .header-panel {
      background: #1e293b;
      padding: 20px 24px;
      border-radius: 14px;
      border: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .header-title h2 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #fff;
    }
    .header-title p {
      margin: 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .summary-badge {
      display: flex;
      gap: 12px;
    }
    .badge-stat {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    .btn-refresh {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-refresh:hover { background: #2563eb; }

    /* Grid Kartu */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: border-color 0.2s;
    }
    .card-item.active-card {
      border-left: 5px solid #10b981;
    }
    .card-item.inactive-card {
      border-left: 5px solid #64748b;
    }
    .col-id {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 170px;
    }
    .id-tag {
      background: #fe2c55;
      color: #fff;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .status-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .status-pill.aktif {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-pill.kosong {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .col-input {
      flex: 1;
      min-width: 260px;
    }
    .url-input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .url-input:focus { border-color: #fe2c55; }
    .col-btns {
      display: flex;
      gap: 8px;
    }
    .btn-update {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-update:hover { background: #059669; }
    .btn-reset {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-reset:hover { background: #dc2626; }
    .btn-link {
      background: #334155;
      color: #f1f5f9;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
    }
    .btn-link:hover { background: #475569; }
    .btn-disabled {
      opacity: 0.35;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-panel">
      <div class="header-title">
        <h2>Dashboard Kontrol Kartu TikTok</h2>
        <p>Pantau status kartu, edit link tujuan, atau reset kartu secara instan.</p>
      </div>
      <div class="summary-badge">
        <div class="badge-stat">Aktif: <strong id="countAktif" style="color:#34d399;">0</strong></div>
        <div class="badge-stat">Kosong: <strong id="countKosong" style="color:#94a3b8;">12</strong></div>
        <button class="btn-refresh" onclick="fetchDatabase()">Segarkan</button>
      </div>
    </div>

    <!-- Container Daftar Kartu 01 - 12 -->
    <div class="card-list" id="cardListContainer">
      <div style="text-align: center; color: #94a3b8; padding: 40px;">Mengambil data kartu dari cloud...</div>
    </div>
  </div>

  <script>
    // ================= MASUKKAN KUNCI JSONBIN ANDA DI SINI =================
    const BIN_ID = "6ac46697ac6210605a17a0b5";
    const MASTER_KEY = "$2a$10$yKQtCYKsrF4d/2K57UOh8.1pWtZpGK6cv.4Y9Gm70oXaMQ28lA/my";
    // =======================================================================

    let database = {};

    async function fetchDatabase() {
      const container = document.getElementById('cardListContainer');
      container.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 40px;">Memperbarui daftar...</div>';

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": MASTER_KEY }
        });
        const data = await res.json();
        database = data.record || {};
        renderDashboard();
      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 40px;">Gagal mengambil data. Pastikan BIN_ID dan MASTER_KEY sudah benar.</div>';
      }
    }

    function renderDashboard() {
      const container = document.getElementById('cardListContainer');
      container.innerHTML = "";

      let countAktif = 0;
      let countKosong = 0;

      // Render daftar untuk kartu 01 sampai 12
      for (let i = 1; i <= 12; i++) {
        const idStr = String(i).padStart(2, '0');
        const activeUrl = database[idStr] || "";
        const isAktif = Boolean(activeUrl);

        if (isAktif) countAktif++;
        else countKosong++;

        const item = document.createElement('div');
        item.className = `card-item ${isAktif ? 'active-card' : 'inactive-card'}`;

        item.innerHTML = `
          <div class="col-id">
            <span class="id-tag">ID: ${idStr}</span>
            <span class="status-pill ${isAktif ? 'aktif' : 'kosong'}">${isAktif ? '● Aktif' : '○ Belum Aktif'}</span>
          </div>

          <div class="col-input">
            <input type="text" class="url-input" id="input_${idStr}" 
              placeholder="${isAktif ? '' : 'Belum diaktivasi (kosong)'}" 
              value="${activeUrl}">
          </div>

          <div class="col-btns">
            <button class="btn-update" onclick="saveLink('${idStr}')">Simpan</button>
            <button class="btn-reset ${isAktif ? '' : 'btn-disabled'}" onclick="resetKartu('${idStr}')">Reset</button>
            <a href="${activeUrl || '#'}" target="_blank" class="btn-link ${isAktif ? '' : 'btn-disabled'}">Buka</a>
          </div>
        `;

        container.appendChild(item);
      }

      document.getElementById('countAktif').innerText = countAktif;
      document.getElementById('countKosong').innerText = countKosong;
    }

    // 1. Simpan / Edit Link Kartu
    async function saveLink(cardId) {
      let val = document.getElementById(`input_${cardId}`).value.trim();
      if (!val) {
        alert("Link TikTok tidak boleh kosong. Jika ingin mengosongkan kartu, gunakan tombol Reset.");
        return;
      }

      if (!val.startsWith("http://") && !val.startsWith("https://")) {
        val = "https://" + val;
      }

      database[cardId] = val;
      await syncToCloud(`Kartu ${cardId} berhasil diupdate ke link baru!`);
    }

    // 2. Reset Kartu (Menghapus link dari database sehingga kartu kembali kosong)
    async function resetKartu(cardId) {
      const ask = confirm(`Apakah Anda yakin ingin MERESET Kartu ${cardId}?\n\nLink TikTok akan dihapus, dan kartu ini akan kembali meminta aktivasi saat di-scan atau di-tap.`);
      if (!ask) return;

      delete database[cardId];
      document.getElementById(`input_${cardId}`).value = "";
      await syncToCloud(`Kartu ${cardId} berhasil di-reset menjadi kosong!`);
    }

    // 3. Sinkronisasi Data ke JSONBin
    async function syncToCloud(pesanSukses) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": MASTER_KEY
          },
          body: JSON.stringify(database)
        });

        alert(pesanSukses);
        renderDashboard();
      } catch (err) {
        alert("Gagal menyimpan ke server cloud!");
      }
    }

    // Ambil data pertama kali saat halaman dibuka
    fetchDatabase();
  </script>
</body>
</html>
