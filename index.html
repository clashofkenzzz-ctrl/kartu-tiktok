<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivasi Kartu TikTok</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #ffffff;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #181818;
      padding: 32px 24px;
      border-radius: 18px;
      border: 1px solid #282828;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    h2 { margin: 0 0 10px; font-size: 20px; font-weight: 700; }
    p { font-size: 14px; color: #a0a0a0; margin: 0 0 24px; line-height: 1.4; }
    .card-badge {
      display: inline-block;
      background: #27272a;
      color: #fe2c55;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #333333;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
      background: #242424;
      color: #fff;
    }
    input:focus { border-color: #fe2c55; }
    button {
      width: 100%;
      padding: 12px;
      background: #fe2c55;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover { background: #e02449; }
    button:disabled { background: #555555; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 13px; color: #fe2c55; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card" id="box">
    <span class="card-badge" id="cardLabel">Memeriksa Kartu...</span>
    <h2>Aktivasi Kartu TikTok</h2>
    <p>Masukkan link profil atau video TikTok untuk mengaktifkan kartu ini secara permanen.</p>
    <input type="text" id="ttLink" placeholder="tiktok.com/@username">
    <button id="btnSave" onclick="saveLink()">Simpan & Aktifkan</button>
    <div class="status" id="statusMsg"></div>
  </div>

  <script>
    // ================= MASUKKAN KUNCI JSONBIN DI SINI =================
    const BIN_ID = "6ac46697ac6210605a17a0b5";
    const MASTER_KEY = "$2a$10$yKQtCYKsrF4d/2K57UOh8.1pWtZpGK6cv.4Y9Gm70oXaMQ28lA/my";
    // ===================================================================

    const urlParams = new URLSearchParams(window.location.search);
    const cardId = urlParams.get('id');

    // Validasi parameter ID kartu
    if (!cardId) {
      document.getElementById('cardLabel').innerText = "ID Tidak Ditemukan";
      document.getElementById('cardLabel').style.color = "#ef4444";
      document.getElementById('statusMsg').innerText = "URL kartu ini tidak memiliki parameter ?id=";
      document.getElementById('btnSave').disabled = true;
    } else {
      document.getElementById('cardLabel').innerText = "ID Kartu: " + cardId;
      cekStatusKartu();
    }

    // 1. Cek apakah kartu dengan ID ini sudah aktif di database
    async function cekStatusKartu() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": MASTER_KEY }
        });
        const data = await res.json();
        const listKartu = data.record || {};

        if (listKartu[cardId]) {
          document.getElementById('box').innerHTML = `
            <h2>Membuka TikTok...</h2>
            <p style="color:#fe2c55;font-weight:600;">ID: ${cardId}</p>
          `;
          window.location.href = listKartu[cardId];
        }
      } catch (err) {
        console.log("Gagal koneksi database:", err);
      }
    }

    // 2. Simpan aktivasi link TikTok ke database
    async function saveLink() {
      let input = document.getElementById('ttLink').value.trim();
      if (!input) {
        document.getElementById('statusMsg').innerText = "Masukkan link TikTok terlebih dahulu.";
        return;
      }

      if (!input.startsWith("http://") && !input.startsWith("https://")) {
        input = "https://" + input;
      }

      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = "Menghubungkan ke Cloud...";

      try {
        const resGet = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": MASTER_KEY }
        });
        const currentData = await resGet.json();
        let allCards = currentData.record || {};

        // Masukkan ID kartu baru beserta link TikTok
        allCards[cardId] = input;

        // Simpan data pembaruan ke database
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": MASTER_KEY
          },
          body: JSON.stringify(allCards)
        });

        document.getElementById('box').innerHTML = `
          <h2>Kartu Berhasil Aktif!</h2>
          <p>Membuka profil TikTok...</p>
        `;

        setTimeout(() => {
          window.location.href = input;
        }, 700);

      } catch (err) {
        btn.disabled = false;
        btn.innerText = "Simpan & Aktifkan";
        document.getElementById('statusMsg').innerText = "Gagal menyimpan. Periksa koneksi internet atau kunci API.";
      }
    }
  </script>
</body>
</html>
