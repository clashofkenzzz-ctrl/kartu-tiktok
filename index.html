<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Card Activation</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #262626;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    h2 { margin: 0 0 10px; font-size: 20px; font-weight: 700; }
    p { font-size: 14px; color: #737373; margin: 0 0 24px; line-height: 1.4; }
    .card-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0284c7;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dbdbdb;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #0095f6; }
    button {
      width: 100%;
      padding: 12px;
      background: #0095f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover { background: #1877f2; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 13px; color: #ed4956; font-weight: 500; }
  </style>
</head>
<body>

<div class="card" id="box">
  <span class="card-badge" id="cardLabel">Memeriksa Kartu...</span>
  <h2>Aktivasi Kartu</h2>
  <p>Masukkan link profil TikTok untuk menghubungkan kartu ini secara permanen.</p>
  <input type="text" id="TikTokLink" placeholder="tiktok.com/username">
  <button id="btnSave" onclick="saveLink()">Simpan & Aktifkan</button>
  <div class="status" id="statusMsg"></div>
</div>

<script>
  // ================= MASUKKAN KUNCI JSONBIN DI SINI =================
  const BIN_ID = "6ac46697ac6210605a17a0b5";
  const MASTER_KEY = "$2a$10$yKQtCYKsrF4d/2K57UOh8.1pWtZpGK6cv.4Y9Gm70oXaMQ28lA/my";
  // ===================================================================

  const urlParams = new URLSearchParams(window.location.search);
  const cardId = urlParams.get('id');

  // Validasi ID kartu wajib ada
  if (!cardId) {
    document.getElementById('cardLabel').style.background = "#fee2e2";
    document.getElementById('cardLabel').style.color = "#ef4444";
    document.getElementById('cardLabel').innerText = "ID Tidak Ditemukan";
    document.getElementById('statusMsg').innerText = "URL kartu ini tidak memiliki parameter ?id=";
    document.getElementById('btnSave').disabled = true;
  } else {
    document.getElementById('cardLabel').innerText = "ID Kartu: " + cardId;
    cekStatusKartu();
  }

  // 1. Cek apakah kartu dengan ID ini sudah aktif di database online
  async function cekStatusKartu() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": MASTER_KEY }
      });
      const data = await res.json();
      const listKartu = data.record || {};

      // Jika ID kartu ini sudah punya data link di database
      if (listKartu[cardId]) {
        document.getElementById('box').innerHTML = `
          <h2>Membuka TikTok...</h2>
          <p style="color:#0284c7;font-weight:600;">ID: ${cardId}</p>
        `;
        window.location.href = listKartu[cardId];
      }
    } catch (err) {
      console.log("Gagal koneksi database:", err);
    }
  }

  // 2. Simpan aktivasi link Instagram ke kartu ini
  async function saveLink() {
    let input = document.getElementById('igLink').value.trim();
    if (!input) {
      document.getElementById('statusMsg').innerText = "Masukkan link Instagram terlebih dahulu.";
      return;
    }

    if (!input.startsWith("http://") && !input.startsWith("https://")) {
      input = "https://" + input;
    }

    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    btn.innerText = "Menghubungkan ke Cloud...";

    try {
      // Ambil data kartu lama
      const resGet = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": MASTER_KEY }
      });
      const currentData = await resGet.json();
      let allCards = currentData.record || {};

      // Masukkan ID kartu baru beserta link Instagram miliknya
      allCards[cardId] = input;

      // Update seluruh data kembali ke database
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": MASTER_KEY
        },
        body: JSON.stringify(allCards)
      });

      document.getElementById('box').innerHTML = `
        <h2>Kartu Berhasil Aktif!</h2>
        <p>Membuka profil TikTok..</p>
      `;

      setTimeout(() => {
        window.location.href = input;
      }, 700);

    } catch (err) {
      btn.disabled = false;
      btn.innerText = "Simpan & Aktifkan";
      document.getElementById('statusMsg').innerText = "Gagal menyimpan. Periksa koneksi internet atau kunci API.";
    }
  }
</script>

</body>
</html>
