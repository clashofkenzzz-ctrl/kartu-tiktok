<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin Reset Kartu TikTok</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #fff;
      margin: 0;
      padding: 24px 16px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      background: #1e293b;
      padding: 20px 24px;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .header h2 { margin: 0 0 6px; font-size: 20px; }
    .header p { margin: 0; font-size: 13px; color: #94a3b8; }
    .btn-refresh {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-refresh:hover { background: #2563eb; }
    .card-list {
      display: grid;
      gap: 12px;
    }
    .card-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 140px;
    }
    .id-badge {
      background: #fe2c55;
      color: #fff;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .status-text {
      font-size: 12px;
      color: #94a3b8;
    }
    .card-input-box {
      flex: 1;
      min-width: 260px;
    }
    .card-input-box input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .card-input-box input:focus { border-color: #fe2c55; }
    .actions {
      display: flex;
      gap: 8px;
    }
    .btn-save {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-save:hover { background: #059669; }
    .btn-reset {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-reset:hover { background: #dc2626; }
    .btn-test {
      background: #475569;
      color: #fff;
      border: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
    }
    .btn-test:hover { background: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h2>Dashboard Kontrol Kartu TikTok</h2>
        <p>Atur, ganti URL tujuan, atau reset kartu langsung ke database.</p>
      </div>
      <button class="btn-refresh" onclick="loadAllCards()">Segarkan Data</button>
    </div>

    <div class="card-list" id="cardListContainer">
      <div style="text-align: center; color: #94a3b8; padding: 40px;">Memuat data kartu...</div>
    </div>
  </div>

  <script>
    // ================= MASUKKAN KUNCI JSONBIN ANDA =================
    const BIN_ID = "MASUKKAN_BIN_ID_ANDA_DISINI";
    const MASTER_KEY = "MASUKKAN_MASTER_KEY_ANDA_DISINI";
    // ===============================================================

    let currentDatabase = {};

    async function loadAllCards() {
      const container = document.getElementById('cardListContainer');
      container.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 40px;">Mengambil data cloud terbaru...</div>';

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": MASTER_KEY }
        });
        const data = await res.json();
        currentDatabase = data.record || {};
        renderList();
      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 40px;">Gagal terhubung ke database. Cek API Key atau koneksi Anda.</div>';
      }
    }

    function renderList() {
      const container = document.getElementById('cardListContainer');
      container.innerHTML = "";

      // Render daftar kartu 01 s/d 12
      for (let i = 1; i <= 12; i++) {
        const idStr = String(i).padStart(2, '0');
        const activeLink = currentDatabase[idStr] || "";

        const item = document.createElement('div');
        item.className = 'card-item';

        item.innerHTML = `
          <div class="card-info">
            <span class="id-badge">ID: ${idStr}</span>
            <span class="status-text">${activeLink ? '<span style="color:#10b981;">● Aktif</span>' : '<span style="color:#eab308;">○ Kosong</span>'}</span>
          </div>

          <div class="card-input-box">
            <input type="text" id="input_${idStr}" placeholder="Belum ada link terpasang" value="${activeLink}">
          </div>

          <div class="actions">
            <button class="btn-save" onclick="updateCard('${idStr}')">Simpan</button>
            <button class="btn-reset" onclick="resetCard('${idStr}')">Reset</button>
            ${activeLink ? `<a href="${activeLink}" target="_blank" class="btn-test">Buka</a>` : ''}
          </div>
        `;

        container.appendChild(item);
      }
    }

    // Fungsi Update / Ganti Link
    async function updateCard(cardId) {
      let newLink = document.getElementById(`input_${cardId}`).value.trim();
      if (!newLink) {
        alert("Link tidak boleh kosong!");
        return;
      }

      if (!newLink.startsWith("http://") && !newLink.startsWith("https://")) {
        newLink = "https://" + newLink;
      }

      currentDatabase[cardId] = newLink;
      await syncData("Link kartu " + cardId + " berhasil diperbarui!");
    }

    // Fungsi Reset Kartu (Menghapus link agar kartu kembali kosong dan siap diaktivasi ulang)
    async function resetCard(cardId) {
      const confirmReset = confirm(`Yakin ingin mereset Kartu ${cardId}?\nKartu akan kembali kosong dan menampilkan formulir aktivasi saat di-scan.`);
      if (!confirmReset) return;

      delete currentDatabase[cardId];
      document.getElementById(`input_${cardId}`).value = "";
      await syncData("Kartu " + cardId + " berhasil di-reset menjadi kosong!");
    }

    // Sinkronisasi perubahan ke JSONBin
    async function syncData(successMsg) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": MASTER_KEY
          },
          body: JSON.stringify(currentDatabase)
        });

        alert(successMsg);
        renderList();
      } catch (err) {
        alert("Gagal memperbarui ke server!");
      }
    }

    // Ambil data pertama kali saat halaman dibuka
    loadAllCards();
  </script>
</body>
</html>
